# Project configuration — source of truth for AI agent tooling.
# Read by /init, /pre-commit, /dependency, and hook scripts.
#
# NOTE: This is the Agent Foundry source repository. The project_type value
# here is arbitrary (used for project-template development/testing). Projects
# created from its template have their own .agents/project.yml with the correct
# project_type written by the create-project script.

project_type: python

project_profile:
  language: [python]
  build_system: poetry
