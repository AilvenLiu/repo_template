# roadmap.yml -- Per-Phase Execution State (Template)
#
# This file is the ONLY authoritative source of execution progress
# for this phase. It must reflect completed work, not intentions.
#
# Each phase folder gets its own roadmap.yml.
# The roadmap.name is the phase folder name.

roadmap:
  name: <PHASE_FOLDER_NAME>
  description: >
    <Describe the purpose and scope of this phase in one or two sentences.>

status:
  active: true
  blocked: false
  completed: false

# Exactly one task MUST be active at any time.
current_focus:
  phase: <PHASE_ID>
  task: <TASK_ID>-1

phases:
  - id: <PHASE_ID>
    title: <Phase Title>
    status: active
    tasks:
      - id: <TASK_ID>-1
        title: <First task title>
        status: active
        notes: >
          <Describe what must be accomplished in this task.>
      - id: <TASK_ID>-2
        title: <Second task title>
        status: pending
      - id: <TASK_ID>-3
        title: <Third task title>
        status: pending
