phase: 2
name: AI Infra Content

status:
  active: true
  blocked: false
  started_at: "2026-05-10"
  completed_at: null

depends_on_phases: [phase-1-profile-architecture]

tasks:
  - id: task-2-1
    title: Author cuda-modern constraint as draft
    description: >
      Write .ai/constraints/cpp/cuda-modern.md covering Tensor Cores
      (WMMA, WGMMA), TMA on Hopper, cudaGraph, cudaMallocAsync and the
      stream-ordered allocator, CUTLASS and CuTe idioms (Layout, Tensor,
      MMA atoms, copy atoms), FP8/BF16/FP16 precision discipline, and
      modern SM dispatch patterns. The file MUST be marked status: draft
      and loaded as advisory. The constraint activates on
      language=cuda axis.
    status: completed
    completed_at: "2026-05-10"
    effort: high
    key_files:
      - .ai/constraints/cpp/cuda-modern.md
      - .ai/capabilities.yml
    depends_on: []
    acceptance:
      - cuda-modern.md exists with status: draft frontmatter.
      - Each numbered topic above is covered with at least one worked example.
      - Loader treats the constraint as advisory until promoted.
      - capabilities.yml or equivalent declares the axis activation rule.

  - id: task-2-2
    title: Author kernel-correctness constraint as draft
    description: >
      Write .ai/constraints/cpp/kernel-correctness.md replacing line-coverage
      with reference-correctness against PyTorch eager, numerical tolerance
      bands per dtype (FP32, FP16, BF16, FP8), performance-regression gates,
      SM-version coverage matrix (SM_80, SM_86, SM_89, SM_90, SM_100), and
      shape-bucket coverage. Marked status: draft. Activates on language=cuda.
    status: active
    effort: high
    key_files:
      - .ai/constraints/cpp/kernel-correctness.md
    depends_on:
      - task-2-1
    acceptance:
      - kernel-correctness.md exists with status: draft frontmatter.
      - Tolerance bands are tabulated by dtype with citations or rationale.
      - Performance-regression gating recipe is concrete (tool, threshold, artefact).
      - SM coverage matrix and shape-bucket recipe are explicit.

  - id: task-2-3
    title: Author ffi-boundary constraint as draft
    description: >
      Create the new directory .ai/constraints/hybrid/ and write
      ffi-boundary.md. Cover pybind11 vs nanobind vs ctypes vs tvm-ffi
      selection criteria, GIL release rules around CUDA kernel launches,
      DLPack as the canonical tensor exchange protocol, capsule lifetimes
      and refcount discipline, error propagation across the boundary, and
      async semantics for stream-ordered results. Marked status: draft.
      Activates on bindings axis being non-empty.
    status: pending
    effort: high
    key_files:
      - .ai/constraints/hybrid/ffi-boundary.md
    depends_on: []
    acceptance:
      - ffi-boundary.md exists with status: draft frontmatter.
      - Each binding option has a selection-criteria block.
      - DLPack section names the canonical roles (capsule producer/consumer).
      - GIL release rules around kernel launches are explicit.

  - id: task-2-4
    title: Author python-cpp-build constraint as draft
    description: >
      Write .ai/constraints/hybrid/python-cpp-build.md covering
      scikit-build-core driving CMake from pyproject.toml, the PyTorch
      CXX11 ABI (_GLIBCXX_USE_CXX11_ABI) and how it is set per wheel,
      TORCH_CUDA_ARCH_LIST as a build-time arch selector, manylinux2014 vs
      manylinux_2_28, auditwheel, and the multi-CUDA-toolkit wheel matrix
      (cu118, cu121, cu124). Marked status: draft. Activates on
      build_system=scikit-build OR distribution=pypi-wheel.
    status: pending
    effort: high
    key_files:
      - .ai/constraints/hybrid/python-cpp-build.md
    depends_on: []
    acceptance:
      - python-cpp-build.md exists with status: draft frontmatter.
      - PyTorch CXX11 ABI section names the flag and how to set it per wheel.
      - manylinux options are compared with selection criteria.
      - Multi-CUDA wheel matrix is concrete (e.g., a worked CI matrix).

  - id: task-2-5
    title: Author system-deps constraint as draft
    description: >
      Write .ai/constraints/hybrid/system-deps.md covering discovery of
      system-installed CUDA Toolkit, cuDNN, NCCL, TensorRT via CMake
      (find_package(CUDAToolkit), find_package(Torch), env-var fallbacks),
      version assertion at configure time, and fail-fast guidance. Mark
      status: draft. Activates on external_dependencies.system_cuda=true.
    status: pending
    effort: medium
    key_files:
      - .ai/constraints/hybrid/system-deps.md
    depends_on: []
    acceptance:
      - system-deps.md exists with status: draft frontmatter.
      - Each NVIDIA library has a discovery snippet and a version-assertion snippet.
      - Fail-fast pattern is explicit (configure-time, not build-time).

  - id: task-2-6
    title: Add bazel skill (vendor-neutral body and Claude stub)
    description: >
      Create .ai/skills/bazel/SKILL.md (vendor-neutral body) and
      .claude/skills/bazel/SKILL.md (Claude Code stub). Add bin/agent-bazel
      wrapper with build, test, run subcommands; subcommands beyond build
      may be stubs that print actionable next-step messages. Update
      .ai/capabilities.yml so the skill is required only when
      build_system=bazel via the axis selector from Phase 1.
    status: pending
    effort: high
    key_files:
      - .ai/skills/bazel/SKILL.md
      - .claude/skills/bazel/SKILL.md
      - bin/agent-bazel
      - .ai/capabilities.yml
    depends_on:
      - task-2-1
      - task-2-2
      - task-2-3
      - task-2-4
      - task-2-5
    acceptance:
      - Both SKILL.md files exist; the Claude stub has the YAML frontmatter format documented in .claude/skills/ARCHITECTURE.md.
      - bin/agent-bazel is executable and dispatches at least the build subcommand.
      - capabilities.yml requires bazel only under build_system=bazel.
      - Stubbed subcommands print "not yet implemented; see Phase 3" or equivalent and exit non-zero.

  - id: task-2-7
    title: Add gpu-ci skill (vendor-neutral body and Claude stub)
    description: >
      Create .ai/skills/gpu-ci/SKILL.md and .claude/skills/gpu-ci/SKILL.md.
      Document sccache for CUDA, auditwheel for manylinux wheels,
      multi-arch wheel build matrix, and H100/A100/L40 gating patterns.
      No bin/agent-gpu-ci wrapper is required in this phase; the skill is
      guidance-only. Capability audit requires it when
      distribution=pypi-wheel OR hardware_targets.cuda_arch is non-empty.
    status: pending
    effort: medium
    key_files:
      - .ai/skills/gpu-ci/SKILL.md
      - .claude/skills/gpu-ci/SKILL.md
      - .ai/capabilities.yml
    depends_on:
      - task-2-6
    acceptance:
      - Both SKILL.md files exist; the Claude stub has the documented frontmatter.
      - sccache, auditwheel, multi-arch matrix, and GPU gating each have a section.
      - capabilities.yml gates the requirement on the documented axes.

  - id: task-2-8
    title: Write hybrid template overlay
    description: >
      Create templates/hybrid/CLAUDE.md, AGENTS.md, CONTRIBUTING.md,
      .gitignore, and project.yml. The project.yml is a worked
      project_profile example for a hybrid project (e.g., language: [python,
      cpp, cuda]; build_system: scikit-build-core; bindings: nanobind;
      distribution: pypi-wheel; external_dependencies.system_cuda: true).
      The CLAUDE.md and AGENTS.md mirror the structure of the existing
      Python and C++ overlays. CONTRIBUTING.md cites the new hybrid
      constraints under .ai/constraints/hybrid/.
    status: pending
    effort: high
    key_files:
      - templates/hybrid/CLAUDE.md
      - templates/hybrid/AGENTS.md
      - templates/hybrid/CONTRIBUTING.md
      - templates/hybrid/.gitignore
      - templates/hybrid/project.yml
    depends_on:
      - task-2-3
      - task-2-4
      - task-2-5
    acceptance:
      - All five files exist under templates/hybrid/.
      - project.yml validates against the Phase-1 schema.
      - CLAUDE.md and AGENTS.md cite .ai/constraints/hybrid/ files.
      - CONTRIBUTING.md mirrors the structure of the existing overlays.

  - id: task-2-9
    title: Update create-project skill for hybrid generation
    description: >
      Update .claude/skills/create-project/ (and its underlying script if
      separate) so it can generate a project from templates/hybrid/. The
      generator copies templates/hybrid/* and writes a project.yml whose
      project_profile reflects the user's chosen axes. Existing
      python-only and cpp-only generation paths MUST keep working
      identically.
    status: pending
    effort: medium
    key_files:
      - .claude/skills/create-project/
    depends_on:
      - task-2-8
    acceptance:
      - create-project supports a hybrid generation path.
      - python-only generation produces a tree identical to pre-Phase-2 (verify with diff against a fixture).
      - cpp-only generation produces a tree identical to pre-Phase-2 (verify with diff against a fixture).
      - Hybrid generation produces a tree containing templates/hybrid/ content with project_profile filled in.

  - id: task-2-10
    title: Validate Phase 2 against a real consuming project
    description: >
      Nominate one real consuming project (TVM fork, FlashInfer fork,
      MLC-LLM fork, xgrammar fork, or similar). The user names the project
      at the time this task activates. Drop the post-Phase-2 template into
      that project and run the standard workflow: bin/agent-init,
      bin/agent-build full, bin/agent-dependency add <something>,
      bin/agent-precommit. Record exact command output and exit codes in
      the session handoff. Any drift discovered MUST be fixed before this
      task can be marked completed. No draft is promoted to stable here;
      promotion is a separate user-approved follow-up.
    status: pending
    effort: high
    key_files:
      - agent_roadmaps/phase-2-ai-infra-content/sessions/
    depends_on:
      - task-2-6
      - task-2-7
      - task-2-9
    acceptance:
      - The chosen consuming project is named in a session handoff.
      - bin/agent-init succeeds against the project.
      - bin/agent-build full succeeds against the project.
      - bin/agent-dependency add succeeds against the project.
      - bin/agent-precommit succeeds against the project.
      - Any drift fixes are recorded and re-tested.
      - No drafts have been promoted to stable.

