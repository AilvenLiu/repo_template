phase: 1
name: Profile Architecture

status:
  active: true
  blocked: false
  started_at: "2026-05-10"
  completed_at: null

depends_on_phases: [phase-0-cleanup]

tasks:
  - id: task-1-1
    title: Write the project_profile schema ADR
    description: >
      Author .ai/adr/0001-project-profile.md documenting the new schema. Cover
      the axes (language, build_system, bindings, distribution, hardware_targets,
      external_dependencies), worked examples for python-only, cpp-only, and a
      hybrid TVM-shaped project, the back-compat semantics for legacy
      project_type values, and trade-offs considered. STOP after writing and
      request explicit user approval before any implementation begins.
    status: completed
    effort: medium
    key_files:
      - .ai/adr/0001-project-profile.md
    depends_on: []
    acceptance:
      - ADR file exists and follows the standard ADR template (Context, Decision, Consequences).
      - At least three worked profile examples are included.
      - The legacy project_type to project_profile mapping table is explicit.
      - User has signed off on the ADR in a session handoff.

  - id: task-1-2
    title: Rename project_type detector to project_profile
    description: >
      Rename .ai/scripts/project_type.py to .ai/scripts/project_profile.py.
      Implement the new schema reader and detector. Retain
      .ai/scripts/project_type.py as a thin shim that re-exports the
      project_profile API and adds a legacy_project_type_to_profile()
      helper. Add unit tests covering: legacy project_type values map to
      expected profiles; new project_profile blocks parse correctly; missing
      or malformed inputs raise structured errors.
    status: completed
    effort: medium
    key_files:
      - .ai/scripts/project_profile.py
      - .ai/scripts/project_type.py
      - .ai/scripts/tests/test_project_profile.py
    depends_on:
      - task-1-1
    acceptance:
      - .ai/scripts/project_profile.py exists with the documented API.
      - .ai/scripts/project_type.py imports from project_profile and exposes the legacy API.
      - Unit tests for legacy and new shapes pass.
      - All current callers of project_type continue to import successfully.

  - id: task-1-3
    title: Refactor constraint loader to use profile axes
    description: >
      Update .ai/scripts/session_init.py to accept a project_profile and load
      constraints additively per axis. When the loader receives a legacy
      project_type value via the shim, it routes through
      legacy_project_type_to_profile() and produces an identical loaded
      constraint set. The constraint bodies under .ai/constraints/ are NOT
      modified. Add round-trip tests proving identical loaded sets pre and
      post refactor for each legacy project_type value.
    status: completed
    effort: high
    key_files:
      - .ai/scripts/session_init.py
      - .ai/scripts/tests/test_session_init.py
    depends_on:
      - task-1-2
    acceptance:
      - session_init.py loads constraints by axis, not by binary type.
      - Round-trip tests for legacy project_type values pass.
      - No file under .ai/constraints/ has been modified.

  - id: task-1-4
    title: Refactor capabilities.yml schema with axis selectors
    description: >
      Update .ai/capabilities.yml so each required skill or wrapper can carry
      a when selector (e.g., when: language=cpp). Update the capability audit
      script (.ai/scripts/capability_audit.py) to evaluate selectors against
      the active profile. Preserve current required-skill behaviour for legacy
      project_type values via the shim. Add fixture tests asserting audit
      equality between legacy and equivalent profile-based configurations.
    status: active
    effort: high
    key_files:
      - .ai/capabilities.yml
      - .ai/scripts/capability_audit.py
      - .ai/scripts/tests/test_capability_audit.py
    depends_on:
      - task-1-3
    acceptance:
      - capabilities.yml uses when selectors and parses cleanly.
      - capability_audit.py evaluates selectors correctly.
      - Audit equality fixture tests pass for each legacy project_type value.

  - id: task-1-5
    title: Refactor bin/agent-build to dispatch by build_system
    description: >
      Update bin/agent-build so it inspects the active profile's build_system
      axis and dispatches accordingly. Keep poetry and cmake paths exactly as
      they are today. Add stub branches for scikit-build, bazel, and mixed
      that print "not yet implemented in this phase; see Phase 2" and exit
      non-zero so they cannot be silently ignored.
    status: pending
    effort: medium
    key_files:
      - bin/agent-build
      - .ai/scripts/tests/test_agent_build.py
    depends_on:
      - task-1-4
    acceptance:
      - bin/agent-build setup, compile, test, full work for a python profile fixture.
      - bin/agent-build setup, compile, test, full work for a cpp profile fixture.
      - bin/agent-build for an unimplemented build_system exits non-zero with a clear message.

  - id: task-1-6
    title: Refactor bin/agent-dependency to dispatch by profile
    description: >
      Update bin/agent-dependency so it inspects the active profile and
      dispatches add/remove operations to the right backend. Keep poetry and
      conan paths exactly as today. Add stub branches for pip (scikit-build
      glue), git submodule, and system NVIDIA package documentation that
      print actionable next-step messages. Do not implement the new backends
      in this phase; that is Phase 2.
    status: pending
    effort: medium
    key_files:
      - bin/agent-dependency
      - .ai/scripts/tests/test_agent_dependency.py
    depends_on:
      - task-1-5
    acceptance:
      - bin/agent-dependency add for a python profile fixture works as before.
      - bin/agent-dependency add for a cpp profile fixture works as before.
      - Stub branches for unimplemented backends print the correct guidance and exit non-zero.

  - id: task-1-7
    title: Add migration note to template overlays
    description: >
      Add a short migration note to templates/python/CLAUDE.md and
      templates/cpp/CLAUDE.md (and the matching AGENTS.md files) explaining
      that the new project_profile block in .ai/project.yml is optional and
      the legacy project_type value still works. The note must point readers
      to the ADR. Do not change any other content in those files.
    status: pending
    effort: low
    key_files:
      - templates/python/CLAUDE.md
      - templates/python/AGENTS.md
      - templates/cpp/CLAUDE.md
      - templates/cpp/AGENTS.md
    depends_on:
      - task-1-6
    acceptance:
      - Each of the four files has a new section pointing to the ADR.
      - No other content in those files has changed (verify with git diff).

  - id: task-1-8
    title: Verify backward compatibility on a real Python project
    description: >
      Run the post-Phase-1 template against an existing real Python project
      that consumes this template. Verify that bin/agent-init, bin/agent-build
      full, bin/agent-dependency add, bin/agent-precommit, and the capability
      audit all behave identically to the pre-Phase-1 template. Record
      evidence (command output, exit codes) in the session handoff. If any
      drift is found, fix it before this task can be marked completed.
    status: pending
    effort: medium
    key_files:
      - agent_roadmaps/phase-1-profile-architecture/sessions/
    depends_on:
      - task-1-7
    acceptance:
      - All five commands behave identically on a real Python project.
      - Evidence is recorded in the session handoff.
      - Any drift discovered has been fixed; the test re-run is also recorded.

focus:
  current_task: task-1-4
  notes: >
    Task-1-3 completed (2026-05-10). Refactored session_init.py to load
    constraints by profile axes instead of binary project_type. The loader now
    composes constraints additively, supporting hybrid multi-language projects.
    Changed if/elif to independent if blocks. Session state now stores
    project_profile instead of project_type. Added 10 round-trip tests proving
    legacy project_type values produce identical constraint sets. All 36 tests
    pass. Now refactoring capabilities.yml to use axis selectors.
