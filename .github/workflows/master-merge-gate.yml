name: Master merge gate

on:
  pull_request_target:
    branches:
      - master
      - 'release/**'
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  master-merge-gate:
    name: master-merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch trusted master policy without checking out pull-request code
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet trusted-policy
          git -C trusted-policy remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C trusted-policy \
            -c http.extraheader="AUTHORIZATION: Bearer ${GITHUB_TOKEN}" \
            fetch --depth=1 origin refs/heads/master
          git -C trusted-policy checkout --detach --quiet FETCH_HEAD

      - name: Enforce source and path policy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Validation provenance (master-merge-policy.md section 9.1): set the
          # repository variable REQUIRED_SOURCE_CHECKS to a comma-separated list
          # of Actions WORKFLOW names, each of which must have a successful
          # push-event run on develop at the recorded Develop-Source-SHA.
          # Workflow names must not contain commas. Leave it unset to keep the
          # release-PR rebuild requirement unchanged.
          REQUIRED_SOURCE_CHECKS: ${{ vars.REQUIRED_SOURCE_CHECKS || '' }}
        run: |
          set -euo pipefail
          python3 trusted-policy/.github/scripts/master-merge-gate.py \
            --event-path "${GITHUB_EVENT_PATH}"
