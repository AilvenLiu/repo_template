# roadmap.yml -- Per-Phase Execution State (Dependency-Aware Template)
#
# This file is the canonical machine-readable execution state for this phase.
# Keep it machine-readable and deterministic.

phase: <PHASE_NUMBER>
name: <PHASE_TITLE>

status:
  active: true
  blocked: false
  started_at: null
  completed_at: null

# Explicit upstream phase dependencies by folder name.
# Example: [upstream-roadmap-phase]
depends_on_phases: <PHASE_DEPENDENCIES>

tasks:
  - id: <TASK_PREFIX>-1
    title: Define implementation baseline for <PHASE_TITLE>
    description: >
      Clarify exact scope, constraints, and acceptance criteria for this phase.
      Confirm objective boundaries and identify files touched first.
    status: active
    effort: medium
    key_files:
      - src/
      - tests/
    depends_on: []

  - id: <TASK_PREFIX>-2
    title: Implement dependency-safe core changes for <PHASE_TITLE>
    description: >
      Implement the primary code changes for this phase while preserving
      upstream invariants and compatibility guarantees.
    status: pending
    effort: medium
    key_files:
      - src/
    depends_on:
      - <TASK_PREFIX>-1

  - id: <TASK_PREFIX>-3
    title: Validate phase result
    description: >
      Run required validation, document final state, and prepare branch merge
      guidance for this phase.
    status: pending
    effort: low
    key_files:
      - tests/
      - docs/
    depends_on:
      - <TASK_PREFIX>-2

focus:
  current_task: <TASK_PREFIX>-1
  notes: >
    Update this note at the end of each session with concise status and next action.
