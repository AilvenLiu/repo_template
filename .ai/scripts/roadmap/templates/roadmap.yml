# roadmap.yml -- Per-Step Execution State (Dependency-Aware Template)
#
# This file is the ONLY authoritative execution state for this step.
# Keep it machine-readable and deterministic.

step: <STEP_NUMBER>
name: <STEP_TITLE>

status:
  active: true
  blocked: false
  started_at: null
  completed_at: null

# Explicit upstream step dependencies by folder name.
# Example: [upstream-roadmap-step]
depends_on_steps: <STEP_DEPENDENCIES>

tasks:
  - id: <TASK_PREFIX>-1
    title: Define implementation baseline for <STEP_TITLE>
    description: >
      Clarify exact scope, constraints, and acceptance criteria for this step.
      Confirm objective boundaries and identify files touched first.
    status: active
    effort: medium
    key_files:
      - src/
      - tests/
    depends_on: []

  - id: <TASK_PREFIX>-2
    title: Implement dependency-safe core changes for <STEP_TITLE>
    description: >
      Implement the primary code changes for this step while preserving
      upstream invariants and compatibility guarantees.
    status: pending
    effort: medium
    key_files:
      - src/
    depends_on:
      - <TASK_PREFIX>-1

  - id: <TASK_PREFIX>-3
    title: Validate outcomes and prepare merge handoff
    description: >
      Run required validation, document final state, and prepare branch merge
      guidance for this step.
    status: pending
    effort: low
    key_files:
      - tests/
      - docs/
    depends_on:
      - <TASK_PREFIX>-2

focus:
  current_task: <TASK_PREFIX>-1
  notes: >
    Update this note at the end of each session with concise status and next action.
