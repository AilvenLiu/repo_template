# Capability Manifest v2
#
# This manifest supports dual-platform auditing:
# - common_requirements: shared across Claude and Codex
# - platform_requirements: platform-specific capabilities
#
# Backward compatibility:
# The loader supports legacy v1 manifests during migration.

common_requirements:
  project_skills:
    - id: python-env-setup
      required: true

    - id: roadmap
      required: true

    - id: navigate
      required: true

    - id: pre-commit
      required: true

    - id: context7
      required: true

    - id: init
      required: true

    - id: check-constraints
      required: true

    - id: dependency
      required: true

    - id: build
      required: true

    - id: create-project
      required: true
      template_only: true
      notes: Removed by the project generator; required only in template repo

  repo_commands:
    - id: agent-init
      path: bin/agent-init
      required: true
      executable: true

    - id: agent-precommit
      path: bin/agent-precommit
      required: true
      executable: true

    - id: agent-dependency
      path: bin/agent-dependency
      required: true
      executable: true

    - id: agent-commit
      path: bin/agent-commit
      required: true
      executable: true

    - id: agent-check-constraints
      path: bin/agent-check-constraints
      required: true
      executable: true

platform_requirements:
  claude:
    claude_plugins:
      - id: context7@claude-plugins-official
        required: true
        notes: Context7 documentation lookup via MCP

      - id: pua@pua-skills
        required: true
        notes: PUA skills (marketplace source tanweai/pua)

    claude_marketplaces:
      - id: claude-plugins-official
        source: anthropics/claude-plugins-official
        required: true

      - id: pua-skills
        source: tanweai/pua
        required: true

    integrations:
      - id: context7-mcp
        required: true
        check: mcp
        notes: >
          Primary method: claude plugin install context7@claude-plugins-official
          Fallback: claude mcp add --transport http context7 https://mcp.context7.com/mcp --header "CONTEXT7_API_KEY: <key>"

  codex:
    codex_skills:
      - id: init
        required: true

      - id: pre-commit
        required: true

      - id: dependency
        required: true

      - id: roadmap
        required: true

      - id: check-constraints
        required: true

      - id: context7
        required: true

    repo_commands:
      - id: agent-init
        path: bin/agent-init
        required: true
        executable: true

      - id: agent-precommit
        path: bin/agent-precommit
        required: true
        executable: true

      - id: agent-dependency
        path: bin/agent-dependency
        required: true
        executable: true

      - id: agent-commit
        path: bin/agent-commit
        required: true
        executable: true

      - id: agent-check-constraints
        path: bin/agent-check-constraints
        required: true
        executable: true
