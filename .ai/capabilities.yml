# Capability Manifest v2
#
# This manifest supports dual-platform auditing:
# - common_requirements: shared across Claude and Codex
# - platform_requirements: platform-specific capabilities
#
# Backward compatibility:
# The loader supports legacy v1 manifests during migration.

common_requirements:
  project_skills:
    - id: python-env-setup
      required: true

    - id: roadmap
      required: true

    - id: navigate
      required: true

    - id: pre-commit
      required: true

    - id: context7
      required: true

    - id: init
      required: true

    - id: check-constraints
      required: true

    - id: dependency
      required: true

    - id: build
      required: true

    - id: create-project
      required: true
      template_only: true
      notes: Removed by the project generator; required only in template repo

  repo_commands:
    - id: agent-init
      path: bin/agent-init
      required: true
      executable: true

    - id: agent-precommit
      path: bin/agent-precommit
      required: true
      executable: true

    - id: agent-dependency
      path: bin/agent-dependency
      required: true
      executable: true

    - id: agent-commit
      path: bin/agent-commit
      required: true
      executable: true

platform_requirements:
  claude:
    claude_plugins:
      - id: context7@claude-plugins-official
        required: true
        notes: Context7 documentation lookup via MCP

      - id: superpowers@claude-plugins-official
        required: true
        notes: Provides superpowers:* plugin skills

      - id: skill-creator@claude-plugins-official
        required: true
        notes: Skill authoring and evaluation tooling

      - id: frontend-design@claude-plugins-official
        required: true
        notes: Frontend design capabilities

      - id: pua@pua-skills
        required: true
        notes: PUA skills (marketplace source tanweai/pua)

    claude_marketplaces:
      - id: claude-plugins-official
        source: anthropics/claude-plugins-official
        required: true

      - id: pua-skills
        source: tanweai/pua
        required: true

    claude_plugin_skills:
      - id: skill-creator:skill-creator
        required: true
        plugin: skill-creator@claude-plugins-official

      - id: superpowers:verification-before-completion
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:receiving-code-review
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:finishing-a-development-branch
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:using-git-worktrees
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:brainstorming
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:using-superpowers
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:dispatching-parallel-agents
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:requesting-code-review
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:executing-plans
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:writing-skills
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:subagent-driven-development
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:systematic-debugging
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:test-driven-development
        required: true
        plugin: superpowers@claude-plugins-official

      - id: superpowers:writing-plans
        required: true
        plugin: superpowers@claude-plugins-official

    integrations:
      - id: context7-mcp
        required: true
        check: mcp

  codex:
    codex_skills:
      - id: init
        required: true

      - id: pre-commit
        required: true

      - id: dependency
        required: true

      - id: roadmap
        required: true

      - id: check-constraints
        required: true

      - id: context7
        required: true

    repo_commands:
      - id: agent-init
        path: bin/agent-init
        required: true
        executable: true

      - id: agent-precommit
        path: bin/agent-precommit
        required: true
        executable: true

      - id: agent-dependency
        path: bin/agent-dependency
        required: true
        executable: true

      - id: agent-commit
        path: bin/agent-commit
        required: true
        executable: true
