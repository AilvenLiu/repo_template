# Capability Manifest v3
#
# Skill bodies live at .ai/skills/<id>/SKILL.md (vendor-neutral).
# Claude Code additionally requires a frontmatter stub at
# .claude/skills/<id>/SKILL.md for slash-command discovery; the audit
# enforces that for the claude platform.
#
# Codex / Cursor / Cline / generic agents.md consumers read AGENTS.md
# natively; the procedures table there points back at .ai/skills/<id>/SKILL.md
# and .ai/bin/agent-<id> wrappers. There is no Codex-side folder.

common_requirements:
  project_skills:
    - id: karpathy-guidelines
      required: true

    - id: python-env-setup
      required: true
      when: language=python

    - id: roadmap
      required: true

    - id: navigate
      required: true

    - id: pre-commit
      required: true

    - id: context7
      required: true

    - id: init
      required: true

    - id: check-constraints
      required: true

    - id: dependency
      required: true

    - id: build
      required: true

    - id: gpu-ci
      required: true
      when: distribution=pypi-wheel OR hardware_targets=cuda
      notes: Relevant for wheel publishing and CUDA-targeted projects

    - id: create-project
      required: true
      template_only: true
      notes: Removed by the project generator; required only in template repo

  repo_commands:
    - id: agent-init
      path: .ai/bin/agent-init
      required: true
      executable: true

    - id: agent-build
      path: .ai/bin/agent-build
      required: true
      executable: true

    - id: agent-precommit
      path: .ai/bin/agent-precommit
      required: true
      executable: true

    - id: agent-dependency
      path: .ai/bin/agent-dependency
      required: true
      executable: true

    - id: agent-python-env-setup
      path: .ai/bin/agent-python-env-setup
      required: true
      executable: true
      when: language=python

    - id: agent-commit
      path: .ai/bin/agent-commit
      required: true
      executable: true

    - id: agent-check-constraints
      path: .ai/bin/agent-check-constraints
      required: true
      executable: true

    - id: agent-roadmap
      path: .ai/bin/agent-roadmap
      required: true
      executable: true

platform_requirements:
  claude:
    claude_plugins:
      - id: context7@claude-plugins-official
        required: true
        notes: Context7 documentation lookup via MCP

    claude_marketplaces:
      - id: claude-plugins-official
        source: anthropics/claude-plugins-official
        required: true

    integrations:
      - id: context7-mcp
        required: true
        check: mcp
        notes: >
          Primary method: claude plugin install context7@claude-plugins-official
          Fallback: claude mcp add --transport http context7 https://mcp.context7.com/mcp --header "CONTEXT7_API_KEY: <key>"

  codex:
    # Codex / Cursor / Cline / generic agents.md consumers read AGENTS.md
    # natively. They do not need a skill folder; the project_skills above
    # are audited against .ai/skills/<id>/SKILL.md, and the .ai/bin/agent-*
    # wrappers are audited via the shared repo_commands list.
    integrations: []
